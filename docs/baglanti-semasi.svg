<text x="1180" y="602" class="small" text-anchor="start">FAT32 kart · 8 GB ile denendi</text>
<text x="1180" y="631" class="small" text-anchor="start">SD yoksa dahili hafıza: 5 fotoğraf</text>
<text x="800" y="652" class="small" text-anchor="middle">USB ile besleme</text>
<rect x="55" y="710" width="1490" height="295" rx="18" fill="#ffffff" stroke="#cdd7e3" stroke-width="2"/>
<text x="80" y="750" class="head" text-anchor="start">BAĞLAMADAN ÖNCE</text>
<text x="80" y="786" class="note" text-anchor="start">USB/güç kapalı olsun. Şema bacak sırasını değil bağlantıları gösterir; kart üzerindeki GPIO etiketlerini izle.</text>
<text x="80" y="822" class="note" text-anchor="start">Tüm GND uçları ortaktır. ESP32 sinyalleri 3,3 V seviyesindedir; GPIO uçlarına 5 V uygulanmaz.</text>
<text x="80" y="858" class="note" text-anchor="start">* SD VCC → 5V: yalnızca 5 V girişli regülatörlü modül için. Yalnız 3,3 V modülde VCC → 3V3.</text>
<text x="80" y="894" class="note" text-anchor="start">* Ekran VCC/LED: 3,3 V uyumlu modül ve akım sınırlamalı arka ışık içindir. Modül belgesini kontrol et.</text>
<text x="80" y="930" class="note" text-anchor="start">Ekranın SDO/MISO ve dokunmatik uçları boş kalır. Harici SD ile ekranın SD yuvasını birlikte bağlama.</text>
<text x="80" y="966" class="small" text-anchor="start">Kabloları kısa tut. Kartı güç kapalıyken tak/çıkar. Ayrıntılar ve modül farkları: docs/BAGLANTILAR.md</text>
<text x="55" y="1040" class="small" text-anchor="start">Yazılım: TFT 18/23/5/2 · SD 25/26/32/33 · RST = -1 · 4 MB klasik ESP32</text>
